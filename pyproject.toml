[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mci"
version = "0.1.0"
description = "Market & Competitive Intelligence Tool — Phase 1 MVP core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
ingestion = ["httpx>=0.27", "trafilatura>=1.8", "pdfplumber>=0.11", "feedparser>=6.0"]
llm = ["anthropic>=0.40"]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mci*", "gtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
